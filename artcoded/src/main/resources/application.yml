vendors:
  file-search:
    base-url: ${FILE_SEARCH_BASE_URL:http://file-search:8080}
  file-service:
    basePath: ${FILE_SERVICE_BASE_PATH:http://localhost:8089}
application:
  timesheet:
    appendToInvoice: ${TIMESHEET_APPEND_TO_INVOICE:false}
  tmpfs: ${TMPFS_PATH:/temporary}
  holidays-config: ${TIMESHEET_HOLIDAYS_CONFIG_FILE_PATH:classpath:default-holidays.json}
  openapi:
    enabled: ${OPENAPI_ENABLED:false}
  upload:
    defaultGraph: ${DEFAULT_GRAPH_UPLOAD:https://bittich.be/graphs/public}
    pathToBackup: ${application.basePath}/files-backup
    pathToUpload: ${application.basePath}/files
    peppolFTP: ${PEPPOL_FTP_URI:sftp://sftp:22}
    expenseIdempotentFilePath: ${application.basePath}/peppol_expense
    successInvoiceIdempotentFilePath: ${application.basePath}/peppol_invoice
    peppolFTPUser: ${PEPPOL_FTP_USER:peppol}
    peppolFTPHostKey: ${PEPPOL_FTP_HOST_KEY:/peppol/id_rsa}
  cv:
    defaultGraph: ${DEFAULT_GRAPH_CV:https://bittich.be/graphs/public}
  dossier:
    pathToBackup: ${application.basePath}/dossiers-backup
  script:
    pathToScripts: ${PATH_TO_SCRIPTS:classpath:scripts}
  mongo:
    pathToDump: ${application.basePath}/dump
    pathToDumpSnapshot: ${application.basePath}/dump-snapshot
  migrations:
    # MongoDB transactions need a replica set (former mongock.transactional)
    transactional: ${MONGO_TRANSACTION_ENABLED:false}
    # Mongock history imported once by Flamingock
    mongock-origin: ${MONGOCK_CHANGELOG_COLLECTION:mongockChangeLog}
    ignore-unknown-mongock-entries: ${MIGRATIONS_IGNORE_UNKNOWN_MONGOCK_ENTRIES:true}
  fixture:
    cv: false
  admin:
    email: ${ADMIN_EMAIL:noreply@somehost.com}
spring:
  jackson:
    # Jackson 3 (Spring Boot 4) with the Spring Boot 3 defaults: the JSON of the API doesn't change
    use-jackson2-defaults: true
  mvc:
    async:
      request-timeout: ${ASYNC_REQUEST_TIMEOUT:90000}
  threads:
    virtual:
      enabled: true
  config:
    import:
      - classpath:config/web.yml
      - classpath:config/cache.yml
      - classpath:config/mongodb.yml
      - classpath:config/logging.yml
      - classpath:config/security.yml
      - classpath:config/mail.yml
      - classpath:config/actuator.yml
      - classpath:config/yahoo.yml
      - ${MAIL_SEARCH_TERM:classpath:config/search-term.yml}
  application:
    name: artcoded-backend-${spring.profiles.active}
  profiles:
    active: ${PROFILE_ACTIVE:dev}
camel:
  threads:
    virtual:
      enabled: ${CAMEL_VIRTUAL_THREADS_ENABLED:true}
  springboot:
    name: camel-${spring.application.name}

# database migrations (Flamingock, successor of Mongock). The former env variables still work.
flamingock:
  enabled: ${FLAMINGOCK_ENABLED:${MONGOCK_ENABLED:true}}
